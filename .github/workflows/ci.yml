name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Check lockfiles and exports
        run: |
          uv lock --check
          uv export --quiet --frozen --no-dev --no-emit-project -o requirements.lock
          uv export --quiet --frozen --extra dev --no-emit-project -o requirements-dev.lock
          uv export --quiet --frozen --only-group build --no-emit-project -o requirements-build.lock
          git diff --exit-code -- requirements.lock requirements-dev.lock requirements-build.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: python -m build --no-isolation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python == '3.13'
        with:
          name: distributions
          path: dist/*
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - run: pip-audit --require-hashes -r requirements.lock
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t proxmox-mcp:test .
      - run: docker run --rm proxmox-mcp:test --version
      - name: Report all container OS and Python vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: proxmox-mcp:test
          scanners: vuln
          vuln-type: os,library
          format: json
          output: trivy-report.json
          exit-code: '0'
      - name: Upload full vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-vulnerabilities
          path: trivy-report.json
          if-no-files-found: warn
      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: proxmox-mcp:test
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          format: table
          exit-code: '1'
